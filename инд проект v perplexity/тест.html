    <style>
        
        :root {
            --primary: #ffffffe1; /* Netflix red style */
            --dark: #141414;
            --light: #f5f5f5;
            --gray: #808080;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1f1f1f;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 { margin-bottom: 20px; color: var(--primary); }
        h2 { font-size: 1.2rem; margin-bottom: 30px; font-weight: normal; }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        button {
            background-color: #333;
            border: 2px solid transparent;
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #444;
            border-color: var(--primary);
        }

        /* Result Styles */
        .result-box {
            display: none;
            animation: fadeIn 0.5s;
        }

        .movie-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .movie-meta {
            color: var(--gray);
            margin-bottom: 20px;
        }

        .movie-desc {
            line-height: 1.6;
            margin-bottom: 30px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: #b20710; }
        
        .btn-secondary { background-color: transparent; border: 2px solid var(--gray); }
        .btn-secondary:hover { border-color: var(--light); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 500px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

    // --- ЛОГИКА ---

    let currentQuestion = 0;
    let scores = {
        action: 0, comedy: 0, drama: 0, horror: 0, scifi: 0, romance: 0, animation: 0
    };

    const quizContainer = document.getElementById('quiz-container');
    const resultContainer = document.getElementById('result-container');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const progressBar = document.getElementById('progress');

    function startQuiz() {
        currentQuestion = 0;
        // Сброс очков
        for (let key in scores) scores[key] = 0;
        quizContainer.style.display = 'block';
        resultContainer.style.display = 'none';
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        questionText.textContent = `${currentQuestion + 1}. ${q.text}`;
        
        // Обновляем прогресс бар
        const progressPercent = ((currentQuestion) / questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        optionsContainer.innerHTML = '';
        
        q.answers.forEach(answer => {
            const btn = document.createElement('button');
            btn.textContent = answer.text;
            btn.onclick = () => selectAnswer(answer.type);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(type) {
        scores[type]++;
        currentQuestion++;

        if (currentQuestion < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizContainer.style.display = 'none';
        resultContainer.style.display = 'block';

        // 1. Находим жанр-победитель
        let maxScore = 0;
        let winnerGenre = 'action'; // default

        for (let genre in scores) {
            if (scores[genre] > maxScore) {
                maxScore = scores[genre];
                winnerGenre = genre;
            }
        }

        // 2. Фильтруем фильмы по победившему жанру
        const suitableMovies = moviesDB.filter(m => m.g === winnerGenre);

        // 3. Выбираем случайный фильм из списка
        const randomMovie = suitableMovies[Math.floor(Math.random() * suitableMovies.length)];

        // 4. Выводим результат
        document.getElementById('res-title').textContent = randomMovie.t;
        document.getElementById('res-meta').textContent = `${randomMovie.y} • ${getGenreName(randomMovie.g)}`;
        document.getElementById('res-desc').textContent = randomMovie.d;
    }

    function getGenreName(code) {
        const names = {
            action: "Боевик", comedy: "Комедия", drama: "Драма",
            horror: "Ужасы", scifi: "Фантастика", romance: "Романтика",
            animation: "Анимация"
        };
        return names[code] || code;
    }

    function restartQuiz() {
        startQuiz();
    }

    // Запуск при загрузке
